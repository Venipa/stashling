# Landing page + docs (apps/docs, static export) to GitHub Pages.
# Runs on docs changes on master, by hand, and every night so the GitHub stars and latest release shown on the
# landing page (read at build time, apps/docs/lib/github.ts) stay fresh.
# One-time setup: Settings -> Pages -> Source: "GitHub Actions".
name: pages

on:
  push:
    branches: [master]
    paths: ["apps/docs/**", "package.json", "bun.lock", ".github/workflows/pages.yml"]
  schedule:
    - cron: "17 3 * * *" # nightly, 03:17 UTC
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - id: pages
        uses: actions/configure-pages@v5

      - run: bun install --frozen-lockfile

      - name: Build
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          NEXT_PUBLIC_SITE_URL: ${{ steps.pages.outputs.base_url }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bun run docs:build
          touch apps/docs/out/.nojekyll # serve _next/ as is

      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/docs/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
